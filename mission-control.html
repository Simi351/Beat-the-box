<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#010402"><title>Mission Lifeline V12 // Mission Control</title><style>
:root{--bg:#010402;--panel:#06110a;--line:#174d26;--green:#00ff66;--green2:#8dffac;--dim:#4a815b;--text:#d8ffe4;--red:#ff4d67;--yellow:#d7ff4f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#010402;color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,102,.025) 0 1px,transparent 1px 4px);z-index:20}body:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #000;z-index:21}#matrix{position:fixed;inset:0;opacity:.13;z-index:-1}.wrap{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.brand{font-size:24px;font-weight:950;color:var(--green);letter-spacing:.09em;text-shadow:0 0 14px #00ff6660}.sub{font-size:11px;color:var(--dim);margin-top:4px}.clock{font-size:12px;color:var(--green2)}button{font:inherit;font-weight:900;border:1px solid #19713a;background:#06170b;color:var(--green2);padding:11px 14px;border-radius:4px;cursor:pointer;text-transform:uppercase}button.primary{background:#0b3b18;color:#caffd4}.danger{color:#ff7a8d;border-color:#7b1f31;background:#210810}.warn{color:var(--yellow);border-color:#64731a}.card{background:linear-gradient(145deg,#06140af2,#020805f2);border:1px solid var(--line);padding:20px;border-radius:6px;box-shadow:0 0 30px #00ff6610}.hero{padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}.hidden{display:none!important}.title{font-size:20px;font-weight:900;color:var(--green)}.big{font-size:44px;font-weight:950;color:var(--green)}.muted{color:var(--dim)}.small{font-size:11px}.terminal{background:#000801;border:1px solid #0d3a1a;padding:14px;border-radius:4px;line-height:1.6;white-space:pre-wrap}.online{color:var(--green)}.red{color:var(--red)}.progress{height:8px;background:#07170b;border:1px solid #164d25}.progress>div{height:100%;background:var(--green);box-shadow:0 0 12px #00ff66}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.core{padding:14px;border:1px solid #123f1f;background:#041008;margin:8px 0}.core b{display:block;color:var(--green2);margin-bottom:5px}input,select,textarea{width:100%;background:#010703;border:1px solid #1b5a2c;color:var(--text);padding:12px;border-radius:3px;font:inherit;margin:6px 0 12px}textarea{min-height:90px;resize:vertical}label{font-size:11px;color:var(--dim);display:block;margin-top:8px}.matrix-table{width:100%;border-collapse:collapse;font-size:12px}.matrix-table th,.matrix-table td{border:1px solid #164d25;padding:8px;text-align:center}.matrix-table th{color:var(--green2);background:#07140a}.matrix-table td input,.matrix-table td select{margin:0;padding:7px;min-width:120px}.live-dot{width:14px;height:14px;border-radius:50%;background:#27332b;border:1px solid #54645a;display:inline-block}.live-dot.on{background:var(--green);box-shadow:0 0 18px #00ff66;animation:pulse 1.1s infinite}.online-card{border-color:#00ff66;box-shadow:0 0 34px #00ff6635}@keyframes pulse{50%{opacity:.45;transform:scale(.83)}}.global{text-align:center;border-color:#00ff66;box-shadow:0 0 60px #00ff6635}.notice{position:fixed;right:8px;bottom:8px;z-index:30;font-size:10px;padding:6px 8px;border:1px solid #174d26;background:#020805;color:#5fa572;border-radius:3px}.footer{text-align:center;color:#315c3d;font-size:10px;margin:26px 0}.section{margin-top:14px}.danger-zone{border-color:#6d2430}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:750px){.brand{font-size:17px}.big{font-size:35px}.wrap{padding:10px}.hero{padding:19px}.two{grid-template-columns:1fr}}
</style></head><body><canvas id="matrix"></canvas><div class="wrap"><header class="top"><div><div class="brand">MISSION LIFELINE // MISSION CONTROL</div><div class="sub">V12 DYNAMIC MULTIPLAYER</div></div><div class="clock" id="clock">--:--:--</div></header><section id="login" class="card hero"><div class="title">&gt;&gt; GAME MASTER LOGIN</div><label>E-Mail</label><input id="email" type="email"><label>Passwort</label><input id="password" type="password"><button id="loginBtn" class="primary">LOGIN</button><div id="loginMsg"></div></section><section id="dash" class="hidden"></section></div><div id="net" class="notice">READY</div><div class="footer">MISSION LIFELINE V12 MISSION CONTROL</div>
<script type="module">
import { firebaseConfig, gameMasterEmail } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const $=id=>document.getElementById(id); $("email").value=gameMasterEmail;
let db,auth,priv=null,states={},global={},attached=false;
const clone=o=>JSON.parse(JSON.stringify(o)); const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const DEFAULT_TEAM_NAMES=["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT"],DEFAULT_PINS=["3817","6042","9153","2478","5361","8294"],DEFAULT_CORES=["NAVIGATION CORE","LIFELINE CORE","STABILITY CORE","BREACH CORE","TRANSFER CORE","VELOCITY CORE"];
function makeDefault(){const p={version:12,teamOrder:[],teams:{},coreOrder:[],cores:{},routes:{},answers:{},fragments:{},finals:{}};DEFAULT_CORES.forEach((name,i)=>{const id=`C${String(i+1).padStart(3,"0")}`;p.coreOrder.push(id);p.cores[id]={name,message:"Löst die physische Aufgabe vor Ort und gebt anschließend den Code ein."}});DEFAULT_TEAM_NAMES.forEach((name,i)=>{const id=`T${String(i+1).padStart(3,"0")}`;p.teamOrder.push(id);p.teams[id]={name,pin:DEFAULT_PINS[i]};p.routes[id]=p.coreOrder.map((_,j)=>p.coreOrder[(i+j)%p.coreOrder.length]);p.answers[id]={};p.fragments[id]={};p.coreOrder.forEach((cid,j)=>{p.answers[id][cid]=["1","32","12","25","6","8"][j]||"";p.fragments[id][cid]=["N7","L4","S2","B9","T3","V5"][j]||""});p.finals[id]=`LIFE-${name[0]}${i+1}`});return p}
function normalize(raw){if(!raw)return null;if(raw.version===12&&Array.isArray(raw.teamOrder)&&Array.isArray(raw.coreOrder))return raw;const p={version:12,teamOrder:[],teams:{},coreOrder:[],cores:{},routes:{},answers:{},fragments:{},finals:{}};const oldTeams=Object.keys(raw.teams||{});(raw.cores||[]).forEach((c,i)=>{const cid=`C${String(i+1).padStart(3,"0")}`;p.coreOrder.push(cid);p.cores[cid]={name:c.name||`CORE ${i+1}`,message:c.message||""}});oldTeams.forEach((name,ti)=>{const tid=`T${String(ti+1).padStart(3,"0")}`;p.teamOrder.push(tid);p.teams[tid]={name,pin:String(raw.teams[name]||"")};p.routes[tid]=(raw.routes?.[name]||[]).map(i=>p.coreOrder[i]).filter(Boolean);p.answers[tid]={};p.fragments[tid]={};p.coreOrder.forEach((cid,i)=>{p.answers[tid][cid]=String(raw.answers?.[name]?.[i]??"");p.fragments[tid][cid]=String(raw.fragments?.[name]?.[i]??"")});p.finals[tid]=String(raw.finals?.[name]??"")});return p}
async function sha(text){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(text)));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function publicFrom(p){const teamPins={},teamNames={},answerHashes={},finalHashes={};for(const tid of p.teamOrder){teamPins[tid]=p.teams[tid].pin;teamNames[tid]=p.teams[tid].name;answerHashes[tid]={};for(const cid of p.coreOrder)answerHashes[tid][cid]=await sha(String(p.answers[tid]?.[cid]??"").trim().toUpperCase());finalHashes[tid]=await sha(String(p.finals[tid]??"").trim().toUpperCase())}return {version:12,teamOrder:p.teamOrder,teamPins,teamNames,coreOrder:p.coreOrder,cores:p.cores,routes:p.routes,answerHashes,fragments:p.fragments,finalHashes}}
function empty(runId){return {runId,started:false,step:0,done:[],fragments:[],hints:0,penalty:0,online:false,lastUpdate:0}}
async function boot(){const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,u=>{if(u?.email===gameMasterEmail)attach()})}
async function loginGM(){try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginMsg").innerHTML=`<div class="terminal red">${esc(e.code||e.message)}</div>`}}
function attach(){if(attached)return;attached=true;$("login").classList.add("hidden");$("dash").classList.remove("hidden");onValue(ref(db,"mission/privateConfig"),s=>{const raw=s.val();priv=normalize(raw);if(!raw)renderInit();else if(raw.version!==12)renderMigration();else render()});onValue(ref(db,"mission/teams"),s=>{states=s.val()||{};render()});onValue(ref(db,"mission/globalState"),s=>{global=s.val()||{};render()})}
function renderInit(){$("dash").innerHTML='<div class="card hero"><div class="title">&gt;&gt; FIRST START</div><p>V12 legt eine dynamische Standardmission mit 6 Teams und 6 Aufgaben an.</p><button id="init" class="primary">INITIALIZE V12 MISSION</button></div>';$("init").onclick=initialize}
function renderMigration(){$("dash").innerHTML='<div class="card hero"><div class="title">&gt;&gt; V11 CONFIGURATION DETECTED</div><p>Die vorhandene Konfiguration kann verlustarm in die dynamische V12-Struktur übernommen werden.</p><button id="migrate" class="primary">MIGRATE TO V12</button></div>';$("migrate").onclick=async()=>{await sync(priv);await newMission(false);alert("Migration abgeschlossen.")}}
async function initialize(){await sync(makeDefault());await newMission(false)}
function st(tid){return states[tid]||empty(global.runId||0)} function route(tid){return priv.routes?.[tid]||[]} function currentCore(tid){const s=st(tid),r=route(tid);return s.step<r.length?r[s.step]:null}
function validate(p){if(!p.teamOrder.length)return "Mindestens ein Team ist erforderlich.";if(!p.coreOrder.length)return "Mindestens eine Aufgabe ist erforderlich.";const pins=p.teamOrder.map(t=>String(p.teams[t]?.pin||""));if(pins.some(v=>!/^[0-9]{4}$/.test(v)))return "Alle Teamcodes müssen vierstellig sein.";if(new Set(pins).size!==pins.length)return "Alle Teamcodes müssen eindeutig sein.";for(const tid of p.teamOrder){const r=p.routes[tid]||[];if(r.length!==p.coreOrder.length||new Set(r).size!==p.coreOrder.length||r.some(cid=>!p.coreOrder.includes(cid)))return `Route für ${p.teams[tid].name} ist unvollständig.`}return ""}
async function sync(p){const error=validate(p);if(error){alert(error);throw new Error(error)}priv=clone(p);await set(ref(db,"mission/privateConfig"),p);await set(ref(db,"mission/publicConfig"),await publicFrom(p));$("net").textContent="CONFIG SAVED"}
function render(){if(!priv)return;const T=priv.teamOrder,C=priv.coreOrder,total=T.length,online=T.filter(t=>st(t).online).length;$("dash").innerHTML=`${online===total&&total?`<div class="card hero global"><div class="title">${online} / ${total} ONLINE</div><div class="big">GLOBAL LIFELINE READY</div></div>`:""}
<div class="card hero"><div class="title">LIVE MISSION CONTROL</div><div class="terminal">FIELD UNITS ONLINE: ${online} / ${total}\nAUFGABEN: ${C.length}</div></div>
<div class="grid section">${T.map(tid=>{const s=st(tid),cid=currentCore(tid),name=priv.teams[tid].name,pct=C.length?Math.min(100,s.step/C.length*100):0;return `<div class="card ${s.online?"online-card":""}"><div class="row"><div class="title">${esc(name)}</div><div style="flex:0"><span class="live-dot ${s.online?"on":""}"></span></div></div><div class="${s.online?"online":"muted"}" style="font-size:20px;font-weight:900">${s.online?"ONLINE":s.started?"ACTIVE":"OFFLINE"}</div><p>${Math.min(s.step,C.length)}/${C.length} • ${cid?esc(priv.cores[cid]?.name):"FINAL ACCESS"}</p><div class="progress"><div style="width:${pct}%"></div></div><p class="small muted">Hints: ${s.hints||0} • Penalty: ${s.penalty||0}</p><div class="row"><button data-next="${tid}">FORCE NEXT</button><button data-reset="${tid}" class="danger">RESET TEAM</button></div></div>`}).join("")}</div>
<div class="card section"><div class="title">MISSION KONFIGURATION</div><p class="muted">Strukturänderungen bitte vor dem Start einer neuen Mission durchführen.</p><div class="two"><div><div class="title">TEAMS (${T.length})</div>${T.map((tid,i)=>`<div class="core"><b>TEAM ${i+1}</b><label>Name</label><input id="tn_${tid}" value="${esc(priv.teams[tid].name)}"><label>4-stelliger Zugangscode</label><input id="tp_${tid}" value="${esc(priv.teams[tid].pin)}" maxlength="4" inputmode="numeric"><button class="danger" data-delteam="${tid}" ${T.length<=1?"disabled":""}>TEAM ENTFERNEN</button></div>`).join("")}<button id="addTeam">+ TEAM HINZUFÜGEN</button></div><div><div class="title">AUFGABEN (${C.length})</div>${C.map((cid,i)=>`<div class="core"><b>AUFGABE ${i+1}</b><label>Name</label><input id="cn_${cid}" value="${esc(priv.cores[cid].name)}"><label>System Message</label><textarea id="cm_${cid}">${esc(priv.cores[cid].message)}</textarea><button class="danger" data-delcore="${cid}" ${C.length<=1?"disabled":""}>AUFGABE ENTFERNEN</button></div>`).join("")}<button id="addCore">+ AUFGABE HINZUFÜGEN</button></div></div><button id="saveStructure" class="primary">NAMEN / CODES / MELDUNGEN SPEICHERN</button></div>
<div class="card section"><div class="title">WECHSELMATRIX</div><div class="row"><button id="autoRoutes">MATRIX AUTOMATISCH ERSTELLEN</button><button id="saveRoutes">MATRIX SPEICHERN</button></div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${C.map((_,i)=>`<th>POS ${i+1}</th>`).join("")}</tr></thead><tbody>${T.map(tid=>`<tr><th>${esc(priv.teams[tid].name)}</th>${C.map((_,pos)=>`<td><select id="r_${tid}_${pos}">${C.map(cid=>`<option value="${cid}" ${route(tid)[pos]===cid?"selected":""}>${esc(priv.cores[cid].name)}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
<div class="card section"><div class="title">LÖSUNGEN & FRAGMENTE</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${C.map(cid=>`<th>${esc(priv.cores[cid].name)}</th>`).join("")}</tr></thead><tbody>${T.map(tid=>`<tr><th>${esc(priv.teams[tid].name)}</th>${C.map(cid=>`<td><label>Lösung</label><input id="a_${tid}_${cid}" value="${esc(priv.answers[tid]?.[cid]??"")}"><label>Fragment</label><input id="f_${tid}_${cid}" value="${esc(priv.fragments[tid]?.[cid]??"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveAnswers" class="primary">LÖSUNGEN & FRAGMENTE SPEICHERN</button></div>
<div class="card section"><div class="title">FINAL CODES</div>${T.map(tid=>`<div class="core"><b>${esc(priv.teams[tid].name)}</b><input id="fin_${tid}" value="${esc(priv.finals[tid]??"")}"></div>`).join("")}<button id="saveFinals">FINAL CODES SPEICHERN</button></div>
<div class="card section"><div class="title">NEW MISSION / COUNTDOWN</div><label>Countdown Sekunden</label><input id="cd" type="number" min="3" max="60" value="${Math.max(3,Number(global.countdownSeconds||10))}"><button id="newMission" class="primary">START NEW MISSION / RESET ALL</button></div>`;
wire()}
function pullBasics(p){for(const tid of p.teamOrder){p.teams[tid].name=$("tn_"+tid)?.value.trim()||p.teams[tid].name;p.teams[tid].pin=$("tp_"+tid)?.value.trim()||p.teams[tid].pin}for(const cid of p.coreOrder){p.cores[cid].name=$("cn_"+cid)?.value.trim()||p.cores[cid].name;p.cores[cid].message=$("cm_"+cid)?.value.trim()??p.cores[cid].message}return p}
function nextId(prefix,existing){let n=1;while(existing.includes(`${prefix}${String(n).padStart(3,"0")}`))n++;return `${prefix}${String(n).padStart(3,"0")}`}
function wire(){document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>forceNext(b.dataset.next));document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetTeam(b.dataset.reset));document.querySelectorAll("[data-delteam]").forEach(b=>b.onclick=()=>deleteTeam(b.dataset.delteam));document.querySelectorAll("[data-delcore]").forEach(b=>b.onclick=()=>deleteCore(b.dataset.delcore));$("addTeam").onclick=addTeam;$("addCore").onclick=addCore;$("saveStructure").onclick=saveStructure;$("autoRoutes").onclick=autoRoutes;$("saveRoutes").onclick=saveRoutes;$("saveAnswers").onclick=saveAnswers;$("saveFinals").onclick=saveFinals;$("newMission").onclick=()=>newMission(true)}
async function saveStructure(){const p=pullBasics(clone(priv));await sync(p)}
async function addTeam(){const p=pullBasics(clone(priv)),tid=nextId("T",p.teamOrder),idx=p.teamOrder.length;p.teamOrder.push(tid);let pin=String(1000+Math.floor(Math.random()*9000));const used=new Set(p.teamOrder.map(t=>p.teams[t]?.pin));while(used.has(pin))pin=String(1000+Math.floor(Math.random()*9000));p.teams[tid]={name:`TEAM ${idx+1}`,pin};p.routes[tid]=p.coreOrder.map((_,j)=>p.coreOrder[(idx+j)%p.coreOrder.length]);p.answers[tid]={};p.fragments[tid]={};p.coreOrder.forEach(cid=>{p.answers[tid][cid]="";p.fragments[tid][cid]=""});p.finals[tid]=`LIFE-${idx+1}`;await sync(p)}
async function deleteTeam(tid){if(priv.teamOrder.length<=1||!confirm(`Team ${priv.teams[tid].name} wirklich entfernen?`))return;const p=clone(priv);p.teamOrder=p.teamOrder.filter(x=>x!==tid);delete p.teams[tid];delete p.routes[tid];delete p.answers[tid];delete p.fragments[tid];delete p.finals[tid];await sync(p);await remove(ref(db,"mission/teams/"+tid))}
async function addCore(){const p=pullBasics(clone(priv)),cid=nextId("C",p.coreOrder);p.coreOrder.push(cid);p.cores[cid]={name:`CORE ${p.coreOrder.length}`,message:"Löst die physische Aufgabe vor Ort und gebt anschließend den Code ein."};p.teamOrder.forEach((tid,i)=>{p.routes[tid]=[...(p.routes[tid]||[]),cid];p.answers[tid]=p.answers[tid]||{};p.fragments[tid]=p.fragments[tid]||{};p.answers[tid][cid]="";p.fragments[tid][cid]=""});await sync(p)}
async function deleteCore(cid){if(priv.coreOrder.length<=1||!confirm(`Aufgabe ${priv.cores[cid].name} wirklich entfernen?`))return;const p=clone(priv);p.coreOrder=p.coreOrder.filter(x=>x!==cid);delete p.cores[cid];p.teamOrder.forEach(tid=>{p.routes[tid]=(p.routes[tid]||[]).filter(x=>x!==cid);delete p.answers[tid]?.[cid];delete p.fragments[tid]?.[cid]});await sync(p)}
async function autoRoutes(){const p=pullBasics(clone(priv)),C=p.coreOrder;p.teamOrder.forEach((tid,i)=>p.routes[tid]=C.map((_,j)=>C[(i+j)%C.length]));await sync(p)}
async function saveRoutes(){const p=pullBasics(clone(priv));for(const tid of p.teamOrder)p.routes[tid]=p.coreOrder.map((_,i)=>$("r_"+tid+"_"+i).value);await sync(p)}
async function saveAnswers(){const p=pullBasics(clone(priv));for(const tid of p.teamOrder)for(const cid of p.coreOrder){p.answers[tid][cid]=$("a_"+tid+"_"+cid).value.trim();p.fragments[tid][cid]=$("f_"+tid+"_"+cid).value.trim()}await sync(p)}
async function saveFinals(){const p=pullBasics(clone(priv));for(const tid of p.teamOrder)p.finals[tid]=$("fin_"+tid).value.trim();await sync(p)}
async function newMission(ask=true){if(ask&&!confirm("Neue Mission starten und alle aktuell konfigurierten Teams zurücksetzen?"))return;const runId=Date.now(),updates={};for(const tid of priv.teamOrder)updates[`mission/teams/${tid}`]=empty(runId);for(const oldTid of Object.keys(states))if(!priv.teamOrder.includes(oldTid))updates[`mission/teams/${oldTid}`]=null;updates["mission/globalState"]={runId,countdownStartedAt:0,countdownSeconds:Math.max(3,Number($("cd")?.value||10))};await update(ref(db),updates);if(ask)alert("Neue Mission gestartet.")}
async function forceNext(tid){const s=st(tid),cid=currentCore(tid);if(!cid)return;const done=[...(s.done||[])];if(!done.includes(cid))done.push(cid);await update(ref(db,"mission/teams/"+tid),{step:s.step+1,done,fragments:[...(s.fragments||[]),priv.fragments[tid]?.[cid]??""],lastUpdate:serverTimestamp()})}
async function resetTeam(tid){if(confirm(`Team ${priv.teams[tid].name} zurücksetzen?`))await set(ref(db,"mission/teams/"+tid),empty(global.runId||Date.now()))}
$("loginBtn").onclick=loginGM;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")loginGM()});function tick(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tick();setInterval(tick,1000);
function startMatrix(){const c=$("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}resize();addEventListener("resize",resize);function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()}startMatrix();boot();
</script></body></html>
