<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010402"><title>Mission Lifeline V12 // Team</title><style>
:root{--bg:#010402;--panel:#06110a;--line:#174d26;--green:#00ff66;--green2:#8dffac;--dim:#4a815b;--text:#d8ffe4;--red:#ff4d67;--yellow:#d7ff4f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#010402;color:var(--text)}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,102,.025) 0 1px,transparent 1px 4px);z-index:20}body:after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #000;z-index:21}#matrix{position:fixed;inset:0;opacity:.13;z-index:-1}.wrap{max-width:1320px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.brand{font-size:24px;font-weight:950;color:var(--green);letter-spacing:.09em;text-shadow:0 0 14px #00ff6660}.sub{font-size:11px;color:var(--dim);margin-top:4px}.clock{font-size:12px;color:var(--green2)}button{font:inherit;font-weight:900;border:1px solid #19713a;background:#06170b;color:var(--green2);padding:11px 14px;border-radius:4px;cursor:pointer;text-transform:uppercase}button.primary{background:#0b3b18;color:#caffd4}.card{background:linear-gradient(145deg,#06140af2,#020805f2);border:1px solid var(--line);padding:20px;border-radius:6px;box-shadow:0 0 30px #00ff6610}.hero{padding:28px}.hidden{display:none!important}.title{font-size:20px;font-weight:900;color:var(--green)}.big{font-size:44px;font-weight:950;color:var(--green)}.muted{color:var(--dim)}.small{font-size:11px}.terminal{background:#000801;border:1px solid #0d3a1a;padding:14px;border-radius:4px;line-height:1.6;white-space:pre-wrap}.online{color:var(--green)}.warnc{color:var(--yellow)}.red{color:var(--red)}.progress{height:8px;background:#07170b;border:1px solid #164d25}.progress>div{height:100%;background:var(--green);box-shadow:0 0 12px #00ff66}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}input{width:100%;background:#010703;border:1px solid #1b5a2c;color:var(--text);padding:12px;border-radius:3px;font:inherit;margin:6px 0 12px}label{font-size:11px;color:var(--dim);display:block;margin-top:8px}.pin{letter-spacing:.45em;text-align:center;font-size:25px}.countdown{font-size:min(28vw,170px);font-weight:950;color:var(--green);text-shadow:0 0 30px #00ff66;line-height:1}.global{text-align:center;border-color:#00ff66;box-shadow:0 0 60px #00ff6635}.online-card{border-color:#00ff66;box-shadow:0 0 34px #00ff6635}.notice{position:fixed;right:8px;bottom:8px;z-index:30;font-size:10px;padding:6px 8px;border:1px solid #174d26;background:#020805;color:#5fa572;border-radius:3px}.footer{text-align:center;color:#315c3d;font-size:10px;margin:26px 0}@media(max-width:650px){.brand{font-size:17px}.big{font-size:35px}.wrap{padding:10px}.hero{padding:19px}}
</style></head><body><canvas id="matrix"></canvas><div class="wrap"><header class="top"><div><div class="brand">MISSION LIFELINE // FIELD TERMINAL</div><div class="sub">V12 DYNAMIC MULTIPLAYER</div></div><div class="clock" id="clock">--:--:--</div></header><section id="login" class="card hero"><div class="title">&gt;&gt; IDENTIFICATION REQUIRED</div><p class="muted">Gebt euren vierstelligen Teamcode ein.</p><label>TEAM ACCESS CODE</label><input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="0000"><div class="row"><button id="loginBtn" class="primary" type="button">AUTHENTICATE</button><button id="voiceBtn" type="button">🔊 STIMME TESTEN</button></div><div id="loginMsg"></div></section><section id="game" class="hidden"></section></div><div id="net" class="notice">CONNECTING...</div><div class="footer">MISSION LIFELINE V12 TEAM CLIENT</div>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase, ref, onValue, update, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
const $=id=>document.getElementById(id);let db,auth,cfg=null,team=sessionStorage.getItem("lifelineTeamV12")||null,state=null,allStates={},global={},serverOffset=0,ownUnsub=null,countdownTimer=null,lastSpoken=null,lastScreen="",attached=false,resetting=false,countdownClaim=false;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
async function sha(text){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(text)));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}
function teamIds(){return Array.isArray(cfg?.teamOrder)?cfg.teamOrder:[]} function coreIds(){return Array.isArray(cfg?.coreOrder)?cfg.coreOrder:[]} function teamName(tid=team){return cfg?.teamNames?.[tid]||tid||"TEAM"} function route(){return cfg?.routes?.[team]||[]} function currentId(){const r=route();return state&&state.step<r.length?r[state.step]:null} function emptyState(){return {runId:global.runId||0,started:true,step:0,done:[],fragments:[],hints:0,penalty:0,online:false,lastUpdate:0}}
function deepVoice(){const vs=speechSynthesis.getVoices()||[],de=vs.filter(v=>String(v.lang||"").toLowerCase().startsWith("de"));return de.find(v=>/markus|martin|stefan|thomas|male|mann|daniel|reed/i.test(v.name))||de[0]||vs[0]||null}
function speak(text){if(!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.lang="de-DE";u.rate=.74;u.pitch=.35;u.volume=1;const v=deepVoice();if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){console.warn(e)}}
async function boot(){try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,u=>{if(u)attachGlobalListeners()});await signInAnonymously(auth)}catch(e){$("net").textContent="FIREBASE ERROR";$("loginMsg").innerHTML=`<div class="terminal red">${esc(e.message)}</div>`}}
function attachGlobalListeners(){if(attached)return;attached=true;onValue(ref(db,".info/serverTimeOffset"),s=>serverOffset=Number(s.val()||0));onValue(ref(db,"mission/publicConfig"),s=>{cfg=s.val();$("net").textContent=cfg?"REALTIME CONNECTED":"WAITING FOR MISSION";if(team&&cfg&&!teamIds().includes(team)){sessionStorage.removeItem("lifelineTeamV12");team=null;state=null;if(ownUnsub){ownUnsub();ownUnsub=null}$("login").classList.remove("hidden");$("game").classList.add("hidden")}if(team&&cfg)attachOwnState();render()});onValue(ref(db,"mission/globalState"),s=>{global=s.val()||{};if(team&&state&&state.runId!==global.runId)resetForRun();render()});onValue(ref(db,"mission/teams"),s=>{allStates=s.val()||{};maybeStartCountdown()})}
async function loginTeam(){if(!cfg){$("loginMsg").innerHTML='<div class="terminal warnc">Mission noch nicht initialisiert.</div>';return}const code=$("pin").value.trim();const found=teamIds().find(tid=>String(cfg.teamPins?.[tid]||"")===code);if(!found){$("loginMsg").innerHTML='<div class="terminal red">✕ TEAMCODE UNGÜLTIG</div>';speak("Authentifizierung fehlgeschlagen. Zugangscode ungültig.");return}team=found;sessionStorage.setItem("lifelineTeamV12",team);speak("Authentifizierung erfolgreich. Team "+teamName()+" verbunden.");$("login").classList.add("hidden");$("game").classList.remove("hidden");attachOwnState();await update(ref(db,"mission/teams/"+team),{started:true,lastUpdate:serverTimestamp()})}
function attachOwnState(){if(!team||!cfg||ownUnsub)return;$("login").classList.add("hidden");$("game").classList.remove("hidden");state=state||emptyState();render();ownUnsub=onValue(ref(db,"mission/teams/"+team),s=>{state=s.val()||emptyState();if(state.runId!==global.runId){resetForRun();return}render()},e=>{$("net").textContent="READ ERROR";console.error(e)})}
async function resetForRun(){if(!team||resetting||!global.runId)return;resetting=true;try{lastScreen="";lastSpoken=null;if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}await update(ref(db,"mission/teams/"+team),emptyState())}finally{resetting=false}}
function render(){if(!team||!cfg||!state)return;if(Number(global.countdownStartedAt||0)>0){renderCountdown();return}if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null}if(state.online){show("waiting",`<div class="card hero online-card"><div class="title">&gt;&gt; LIFELINE NODE</div><div class="big">ONLINE</div><div class="terminal">TEAM: ${esc(teamName())}\nWAITING FOR GLOBAL COMPLETION</div></div>`);return}const r=route(),total=r.length;if(state.step>=total){const fs=(state.fragments||[]).map((f,i)=>(i+1)+". "+esc(f)).join("<br>");show("final",`<div class="card hero"><div class="title">&gt;&gt; FINAL LIFELINE ACCESS</div><p class="muted">Nutzt eure Fragmente und gebt das Lifeline-Passwort ein.</p><div class="terminal">${fs||"Keine Fragmente gespeichert."}</div><label>LIFELINE PASSWORT</label><input id="finalInput"><button id="finalBtn" class="primary">VERIFY LIFELINE PASSWORD</button><div id="feedback"></div></div>`);$("finalBtn").onclick=verifyFinal;return}const cid=currentId(),c=cfg.cores?.[cid];if(!c){show("err",'<div class="card hero"><div class="terminal red">CORE CONFIG ERROR</div></div>');return}const done=Math.min(state.step,total),pct=total?done/total*100:100;show("core-"+state.step,`<div class="card hero"><div class="small muted">FIELD UNIT // ${esc(teamName())}</div><div class="big">${done}/${total}</div><div class="progress"><div style="width:${pct}%"></div></div></div><div class="card" style="margin-top:14px"><div class="title">${esc(c.name)}</div><div class="terminal">${esc(c.message)}</div><div class="row" style="margin-top:10px"><button id="msgVoice">🔊 PLAY MESSAGE</button></div><label>CODE FROM PHYSICAL STATION</label><input id="answer"><div class="row"><button id="answerBtn" class="primary">VERIFY ACCESS</button><button id="hintBtn">REQUEST HINT</button></div><div id="feedback"></div></div>`);$("msgVoice").onclick=()=>speak(c.message);$("answerBtn").onclick=verifyAnswer;$("hintBtn").onclick=requestHint}
function show(key,html){if(lastScreen===key)return;lastScreen=key;$("game").innerHTML=html}
async function verifyAnswer(){const cid=currentId();if(!cid)return;const entered=await sha($("answer").value.trim().toUpperCase());if(entered!==cfg.answerHashes?.[team]?.[cid]){$("feedback").innerHTML='<div class="terminal red" style="font-size:18px;font-weight:900">✕ FALSCHER CODE</div>';speak("Falscher Code. Bitte überprüft eure Lösung.");await update(ref(db,"mission/teams/"+team),{penalty:(state.penalty||0)+2,lastUpdate:serverTimestamp()});return}const fragment=cfg.fragments?.[team]?.[cid]??"",done=[...(state.done||[])];if(!done.includes(cid))done.push(cid);const fragments=[...(state.fragments||[]),fragment];await update(ref(db,"mission/teams/"+team),{step:state.step+1,done,fragments,lastUpdate:serverTimestamp()});showFragment(fragment)}
function showFragment(f){lastScreen="fragment-"+Date.now();$("game").innerHTML=`<div class="card hero"><div class="title">&gt;&gt; SYSTEM FRAGMENT RECOVERED</div><div class="terminal" style="text-align:center"><div class="big">${esc(f||"—")}</div>SAVE THIS FRAGMENT FOR FINAL ACCESS</div><button id="cont" class="primary">CONTINUE MISSION</button></div>`;if(f)speak("Systemfragment gesichert. Euer Fragment lautet "+f+".");else speak("Aufgabe erfolgreich abgeschlossen.");$("cont").onclick=()=>{lastScreen="";render()}}
async function requestHint(){await update(ref(db,"mission/teams/"+team),{hints:(state.hints||0)+1,lastUpdate:serverTimestamp()});$("feedback").innerHTML='<div class="terminal warnc">MISSION CONTROL INFORMED</div>'}
async function verifyFinal(){const entered=await sha($("finalInput").value.trim().toUpperCase());if(entered!==cfg.finalHashes?.[team]){$("feedback").innerHTML='<div class="terminal red" style="font-size:18px;font-weight:900">✕ FALSCHES LIFELINE PASSWORT</div>';speak("Falsches Lifeline Passwort.");return}await update(ref(db,"mission/teams/"+team),{online:true,lastUpdate:serverTimestamp()});speak("Lifeline Code akzeptiert. Team "+teamName()+" ist online.")}
async function maybeStartCountdown(){const ids=teamIds();if(!cfg||!global||!ids.length||countdownClaim||Number(global.countdownStartedAt||0)>0)return;if(!ids.every(tid=>allStates?.[tid]?.online===true))return;countdownClaim=true;try{const start=Math.round(Date.now()+serverOffset+3000);await runTransaction(ref(db,"mission/globalState/countdownStartedAt"),current=>Number(current||0)>0?undefined:start)}catch(e){console.warn("Countdown claim",e)}finally{countdownClaim=false}}
function renderCountdown(){if(countdownTimer)return;const tick=()=>{const start=Number(global.countdownStartedAt||0),seconds=Math.max(3,Number(global.countdownSeconds||10)),now=Date.now()+serverOffset,remaining=Math.max(0,Math.ceil((start+seconds*1000-now)/1000)),total=teamIds().length;if(remaining>0){show("cd-"+remaining,`<div class="card hero global"><div class="title">&gt;&gt; GLOBAL LIFELINE SYNCHRONIZATION</div><div class="countdown">${remaining}</div><div class="terminal">ALLE ${total} FIELD UNITS ONLINE\nFINAL COUNTDOWN ACTIVE</div></div>`);if(lastSpoken!==remaining){lastSpoken=remaining;speak(String(remaining))}}else{show("complete",`<div class="card hero global"><div class="title">MISSION COMPLETE</div><div class="big">GLOBAL LIFELINE RESTORED</div><div class="terminal">${total} / ${total} FIELD UNITS ONLINE</div></div>`);if(lastSpoken!=="complete"){lastSpoken="complete";speak("Mission Complete. Global Lifeline wiederhergestellt.")}clearInterval(countdownTimer);countdownTimer=null}};tick();countdownTimer=setInterval(tick,200)}
$("loginBtn").onclick=loginTeam;$("voiceBtn").onclick=()=>speak("Systemtest. Sprachausgabe aktiv.");$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")loginTeam()});function tickClock(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tickClock();setInterval(tickClock,1000);
function startMatrix(){const c=$("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}resize();addEventListener("resize",resize);function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()}startMatrix();boot();
</script></body></html>
