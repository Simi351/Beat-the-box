  if(!fragment){fb.innerHTML='<div class="terminal red">⚠ FÜR DIESE STATION IST KEIN FRAGMENT HINTERLEGT.<br>Das Team wird nicht weitergeschaltet.</div>';if(btn)btn.disabled=false;return}
  let advanced=false,nextState=null;
  const tx=await runTransaction(ref(db,ROOT+"/teams/"+teamId),current=>{
    current=current||emptyState();
    if(Number(current.runId||0)!==Number(global.runId||0))return;
    const r=route(),rawDone=Array.isArray(current.done)?current.done:[],doneSet=new Set(rawDone),orderedDone=r.filter(id=>doneSet.has(id)),idx=orderedDone.length;
    if(idx>=r.length||r[idx]!==sid)return current;
    orderedDone.push(sid);
    const fragments=orderedDone.map(id=>String(cfg.fragments?.[teamId]?.[id]??"")).filter(v=>v!=="");
    advanced=true;
    return {...current,started:true,step:orderedDone.length,done:orderedDone,fragments,lastUpdate:Date.now()};
  });
  nextState=tx.snapshot.val();
  if(!advanced){fb.innerHTML='<div class="terminal warnc">Diese Station wurde bereits verarbeitet oder der Teamstand hat sich geändert. Ansicht wird synchronisiert.</div>';state=nextState||state;lastScreen="";render();return}
  state=nextState||state;lastScreen="";showFragment(fragment)
 }catch(e){console.error("verifyAnswer",e);fb.innerHTML='<div class="terminal red">⚠ CODEPRÜFUNG FEHLGESCHLAGEN<br>'+esc(e.code||e.message||String(e))+'</div>';speak("Technischer Fehler bei der Codeprüfung.");const btn=$("answerBtn");if(btn)btn.disabled=false}
}
function showFragment(f){lastScreen="fragment-"+Date.now();$("game").innerHTML=`<div class="card hero"><div class="title">&gt;&gt; SYSTEM FRAGMENT RECOVERED</div><div class="terminal" style="text-align:center"><div class="big">${esc(f)}</div>SAVE THIS FRAGMENT FOR FINAL ACCESS</div><button id="cont" class="primary">CONTINUE MISSION</button></div>`;speak("Systemfragment gesichert. Euer Fragment lautet "+f+".");$("cont").onclick=()=>{lastScreen="";render()}}
async function requestHint(){
 const sid=currentStationId(),stationHints=(station(sid)?.hints||[]).filter(h=>String(h).trim()),used=Number(state.hintUsage?.[sid]||0),fb=$("feedback");
 if(!stationHints.length){fb.innerHTML='<div class="terminal warnc">Für diese Station sind noch keine Hinweise hinterlegt.</div>';return}
 if(used>=stationHints.length){fb.innerHTML='<div class="terminal warnc">Keine weiteren Hinweise verfügbar.</div>';return}
 if(!confirm("Hinweis "+(used+1)+" für diese Station wirklich anfordern?"))return;
 try{
  const usage={...(state.hintUsage||{}),[sid]:used+1};
  fb.innerHTML='<div class="terminal">HINWEIS WIRD FREIGESCHALTET…</div>';
  await update(ref(db,ROOT+"/teams/"+teamId),{hints:Number(state.hints||0)+1,hintUsage:usage,lastUpdate:serverTimestamp()});
  state={...state,hints:Number(state.hints||0)+1,hintUsage:usage};lastScreen="";render();
  speak("Hinweis "+(used+1)+" freigeschaltet. "+stationHints[used])
 }catch(e){console.error("requestHint",e);fb.innerHTML='<div class="terminal red">⚠ HINWEIS KONNTE NICHT GESPEICHERT WERDEN<br>'+esc(e.code||e.message||String(e))+'</div>';speak("Hinweis konnte technisch nicht freigeschaltet werden.")}
}
async function verifyFinal(){const total=route().length;if(progressIndex()<total||fragmentsForDone().length<total){$("feedback").innerHTML='<div class="terminal red">⚠ FINALE NOCH NICHT FREIGEGEBEN</div>';return}const entered=await sha($("finalInput").value.trim().toUpperCase());if(entered!==cfg.finalHashes?.[teamId]){$("feedback").innerHTML='<div class="terminal red" style="font-size:18px;font-weight:900">✕ FALSCHES LIFELINE PASSWORT</div>';speak("Falsches Lifeline Passwort.");return}await update(ref(db,ROOT+"/teams/"+teamId),{online:true,lastUpdate:serverTimestamp()});speak("Lifeline Code akzeptiert. Team "+team().name+" ist online.")}
async function maybeStartCountdown(){const ids=teams().map(t=>t.id);if(!cfg||!global||global.status!=="running"||countdownClaim||Number(global.countdownStartedAt||0)>0||!ids.length)return;if(!ids.every(id=>allStates?.[id]?.online===true))return;countdownClaim=true;try{const start=Math.round(Date.now()+serverOffset);await runTransaction(ref(db,ROOT+"/globalState/countdownStartedAt"),current=>Number(current||0)>0?undefined:start)}catch(e){console.warn("Countdown claim",e)}finally{countdownClaim=false}}
function renderCountdown(){if(countdownTimer)return;const tick=()=>{const start=Number(global.countdownStartedAt||0),seconds=Math.max(3,Number(global.countdownSeconds||cfg?.countdownSeconds||10)),now=Date.now()+serverOffset,remaining=Math.max(0,Math.ceil((start+seconds*1000-now)/1000)),total=teams().length;if(remaining>0){show("cd-"+remaining,`<div class="card hero global" style="text-align:center"><div class="title">&gt;&gt; GLOBAL LIFELINE SYNCHRONIZATION</div><div class="countdown">${remaining}</div><div class="terminal">ALLE ${total} FIELD UNITS ONLINE\nFINAL COUNTDOWN ACTIVE</div></div>`);if(lastSpoken!==remaining){lastSpoken=remaining;speak(String(remaining))}}else{show("complete",`<div class="card hero global"><div class="title">MISSION COMPLETE</div><div class="big">GLOBAL LIFELINE RESTORED</div><div class="terminal">${total} / ${total} FIELD UNITS ONLINE</div></div>`);if(lastSpoken!=="complete"){lastSpoken="complete";speak("Mission Complete. Global Lifeline wiederhergestellt.")}clearInterval(countdownTimer);countdownTimer=null}};tick();countdownTimer=setInterval(tick,200)}
$("loginBtn").onclick=loginTeam;$("voiceBtn").onclick=()=>speak("Systemtest. Sprachausgabe aktiv.");$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")loginTeam()});function tickClock(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tickClock();setInterval(tickClock,1000);function startMatrix(){const c=document.getElementById("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}resize();addEventListener("resize",resize);function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()}
const saved=sessionStorage.getItem("lifelineTeamV13");if(saved)teamId=saved;startMatrix();boot();
